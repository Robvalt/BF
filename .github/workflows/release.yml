name: Build and Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  # JOB 1: Calculate the next incremented version number
  setup:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.versioning.outputs.next_version }}
    steps:
      - name: Calculate Next Version
        id: versioning
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com{{ github.repository }}/releases/latest" | jq -r .tag_name)
          
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0"
          fi
          
          NUM_PART=$(echo "$LATEST_TAG" | sed 's/[^0-9.]//g')
          NEXT_NUM=$(echo "$NUM_PART + 0.1" | bc)
          NEXT_TAG="v$NEXT_NUM"
          echo "Next calculated version: $NEXT_TAG"
          echo "next_version=$NEXT_TAG" >> $GITHUB_OUTPUT

  # JOB 2: Build and Package Artifacts under a Headless Virtual Framebuffer Context
  build-and-package:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Compilers, Libraries, and X11 Virtual Displays
        run: |
          sudo apt-get update
          # xvfb provides a fake virtual display layout to let X11 apps pass execution steps safely
          sudo apt-get install -y mingw-w64 libcairo2-dev libasound2-dev pkg-config xvfb zip

      - name: Build Project and Execute via Virtual Framebuffer
        run: |
          # xvfb-run fools your app into thinking it is running on a monitor with display context
          xvfb-run --server-args="-screen 0 1920x1080x24" make all

      - name: Archive Build Artifacts into Compression Formats
        run: |
          tar -czvf BF-Linux.tar.gz -C build BF.x86_64.elf
          
          cd build
          zip ../BF-Win64.zip BF.win64.exe
          zip ../BF-Win32.zip BF.win32.exe
          cd ..

      - name: Upload Compressed Archives for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            BF-Linux.tar.gz
            BF-Win64.zip
            BF-Win32.zip
          retention-days: 1

  # JOB 3: Push the new version tracking history to GitHub Releases
  create-release:
    runs-on: ubuntu-latest
    needs: [setup, build-and-package]
    steps:
      - name: Download Final Archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives

      - name: Create Unique GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.next_version }}
          name: "Nightly Build - ${{ needs.setup.outputs.next_version }}"
          body: "Automated nightly compilation history update."
          prerelease: true
          files: |
            BF-Linux.tar.gz
            BF-Win64.zip
            BF-Win32.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
